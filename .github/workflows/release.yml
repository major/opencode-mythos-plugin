name: Release

# Publishes to npm when a version tag (for example v0.1.1) is pushed.
# Uses npm trusted publishing (OIDC), so no npm token is stored in GitHub.
# npm adds provenance automatically because the repo and package are public.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Never cancel a publish that is already running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Lets npm exchange the GitHub OIDC token for a publish credential.
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true # A release must not restore a cache that other runs could have poisoned.

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Fails early with a clear message instead of a confusing OIDC error.
      - name: Check npm version
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          if [ "$(printf '%s\n' 11.5.1 "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${npm_version} is too old for trusted publishing (need 11.5.1 or later)"
            exit 1
          fi

      # Stops a tag like v0.2.0 from publishing a package.json that still says 0.1.0.
      - name: Check tag matches package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prepublishOnly runs the typecheck, tests, build, and verify:package first.
      - name: Publish
        run: npm publish
