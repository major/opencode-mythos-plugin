name: Release

# release-please keeps a Release PR open that bumps the version and updates CHANGELOG.md.
# Merging that PR creates the vX.Y.Z tag and GitHub Release, then the publish job ships it
# to npm in the same run. Publishing uses npm trusted publishing (OIDC), so no npm token is
# stored in GitHub, and npm adds provenance because the repo and package are public.
#
# Keep this filename: the npm trusted publisher is bound to "release.yml".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a release or publish that is already running.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Create tags and GitHub Releases (used only by the GITHUB_TOKEN fallback).
      pull-requests: write # Open and update the Release PR (same).
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # PRs opened with the default GITHUB_TOKEN do not trigger CI, so the Release PR would never
      # get its required check. A GitHub App token avoids that. Without the app configured, this
      # falls back to GITHUB_TOKEN and the Release PR needs a manual CI run (or admin merge).
      - name: Create GitHub App token
        id: app-token
        if: vars.RELEASE_APP_CLIENT_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write # release-please manages its autorelease labels.

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # Lets npm exchange the GitHub OIDC token for a publish credential.
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true # A release must not restore a cache that other runs could have poisoned.

      # Trusted publishing needs Node 22.14+ and npm 11.5.1+.
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Fails early with a clear message instead of a confusing OIDC error.
      - name: Check npm version
        run: |
          npm_version="$(npm --version)"
          echo "npm ${npm_version}"
          if [ "$(printf '%s\n' 11.5.1 "${npm_version}" | sort -V | head -n1)" != "11.5.1" ]; then
            echo "::error::npm ${npm_version} is too old for trusted publishing (need 11.5.1 or later)"
            exit 1
          fi

      # Guards against publishing a package.json that does not match the release tag.
      - name: Check tag matches package version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${TAG}" != "v${version}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # prepublishOnly runs the typecheck, tests, build, and verify:package first.
      - name: Publish
        run: npm publish
